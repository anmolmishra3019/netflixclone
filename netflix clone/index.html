<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <meta name="description" content="A functional Netflix clone built with vanilla HTML, CSS, and JS.">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-left">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" class="logo">
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">TV Shows</a></li>
        <li><a href="#">Movies</a></li>
        <li><a href="#">New & Popular</a></li>
        <li><a href="#">My List</a></li>
      </ul>
    </div>
    <div class="navbar-right">
      <i class="fas fa-search"></i>
      <i class="fas fa-bell"></i>
      <div class="profile-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Profile" class="profile-img">
        <i class="fas fa-caret-down"></i>
      </div>
    </div>
  </nav>

  <!-- Featured Banner -->
  <header id="banner" class="banner">
    <div class="banner-contents">
      <h1 class="banner-title" id="banner-title">Loading...</h1>
      <div class="banner-buttons">
        <button class="banner-button play-button"><i class="fas fa-play"></i> Play</button>
        <button class="banner-button info-button"><i class="fas fa-info-circle"></i> More Info</button>
      </div>
      <p class="banner-description" id="banner-description">
        <!-- Description will be injected here -->
      </p>
    </div>
    <div class="banner-fadeBottom"></div>
  </header>

  <!-- Movie Rows Container -->
  <main id="netflix-rows" class="movie-rows-container">
    <!-- Rows will be dynamically injected here using JS -->
  </main>

  <!-- Custom Scripts -->
  <script src="script.js"></script>
</body>
</html>
